services:
  # ── Backend API (Node.js + PostgreSQL Neon) ──────────────────────────────
  - type: web
    name: tjpubls-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        sync: false          # configurar manualmente en Render dashboard
      - key: JWT_SECRET
        sync: false          # configurar manualmente en Render dashboard
      - key: FRONTEND_URL
        sync: false          # URL del frontend, ej: https://frontend-publs.onrender.com
      - key: NODE_ENV
        value: production
      # PORT lo asigna Render automáticamente; no fijar 3000 aquí
      - key: REDIS_DISABLED
        value: true
    healthCheckPath: /health
    plan: free

  # ── Frontend (React + Ionic PWA) ─────────────────────────────────────────
  - type: web
    name: tjpubls-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
    dockerBuildArgs:
      - key: VITE_API_URL
        sync: false          # URL del backend + /api/v1, ej: https://backend-publs.onrender.com/api/v1
    plan: free
