services:
  # ── Backend API (Node.js + PostgreSQL Neon) ──────────────────────────────
  - type: web
    name: tjpubls-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        sync: false          # configurar manualmente en Render dashboard
      - key: JWT_SECRET
        sync: false          # configurar manualmente en Render dashboard
      - key: FRONTEND_URL
        sync: false          # URL del frontend en Render, ej: https://tjpubls-web.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: REDIS_DISABLED
        value: true
    healthCheckPath: /health
    plan: free

  # ── Frontend (React + Ionic PWA) ─────────────────────────────────────────
  - type: web
    name: tjpubls-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
    dockerBuildArgs:
      - key: VITE_API_URL
        sync: false          # URL del backend en Render, ej: https://tjpubls-api.onrender.com/api/v1
    plan: free
